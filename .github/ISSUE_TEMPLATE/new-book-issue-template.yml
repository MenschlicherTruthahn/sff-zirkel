name: Add new book
description: Issue to create a new database record for the book database.
title: "Add new book: enter-book-title-here"
labels: ["book"]
body:
  - type: markdown
    attributes:
      value: |
        Opening this issue will query https://openlibrary.org/ for a book and its metadata. Upon finding a valid book, it creates a new database entry for the book queried. You may fill in the review-related metadata fields below — if you leave them at their defaults, they are created empty and can be filled later. A good query is an ISBN, the Work-ID of the book at OpenLibrary or the title.

        > [!IMPORTANT]
        > Before opening this issue, use the [Query Test page](https://rue-a.github.io/sff-zirkel/test_query.html) to preview which book OpenLibrary would select for your query.

  - type: input
    id: query
    attributes:
      label: Query
      description: Query. It is strongly recommended to use the test query page beforehand.
      placeholder: "e.g. 9781234567890 or OL44370085W"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Metadata**.

  - type: input
    id: review-date
    attributes:
      label: Review date
      placeholder: YYYY-MM-DD

  - type: input
    id: proposer
    attributes:
      label: Proposer
      placeholder: namehere

  - type: input
    id: guests
    attributes:
      label: Guests
      description: "Guests are participants that are not permanent members (see `data/club.json`). Permanent members are added automatically."
      placeholder: "namehere, namehere"
