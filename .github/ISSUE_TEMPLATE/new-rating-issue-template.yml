name: Rate book
description: Issue to add a rating to a book existing in the books database.
title: "Add rating to book: enter-book-title-here"
labels: ["rating"]
body:
  - type: markdown
    attributes:
      value: |
        Upon finding a book with the provided ID in the books database and if the provided reviewer is a participant for this book, the rating is inserted accordingly.

        > [!WARNING]
        > Submitting a rating for a reviewer who has already rated this book will **overwrite** the existing rating without warning.

  - type: input
    id: book-id
    attributes:
      label: book id
      description: "OpenLibrary key: begins with `OL` and ends with `W`, find it on the right below the cover at https://rue-a.github.io/sff-zirkel/"
      placeholder: OL...W
    validations:
      required: true

  - type: input
    id: reviewer
    attributes:
      label: reviewer
      placeholder: enter-reviewer-name-here
    validations:
      required: true

  - type: input
    id: rating
    attributes:
      label: rating
      description: A value according to your rating scheme (integer from 1 to 15).
      placeholder: "e.g. 12"
    validations:
      required: true
