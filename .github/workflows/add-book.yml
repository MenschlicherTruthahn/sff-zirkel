name: Add book from issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-book:
    if: |
      contains(github.event.issue.labels.*.name, 'book') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      (github.event.action == 'opened' || github.event.changes.body != null)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "automated", color: "adadad", description: "Automatically merge PRs" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              }
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run book ingestion
        id: ingestion
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python add_book.py

      - name: Create branch and commit
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          BRANCH="add-book-issue-${{ github.event.issue.number }}"
          git checkout -B "$BRANCH"

          git add data/books.json covers || true
          git diff --cached --quiet && exit 0

          git commit -m "Add book from issue #${{ github.event.issue.number }}"
          git push --force origin "$BRANCH"

      - name: Create PR
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --head "add-book-issue-${{ github.event.issue.number }}" \
            --base main \
            --title "Add book from issue #${{ github.event.issue.number }}" \
            --body "Handles #${{ github.event.issue.number }}" \
            --label "automated" || true

      - name: Merge PR
        id: merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "add-book-issue-${{ github.event.issue.number }}" \
            --squash \
            --delete-branch \
            --subject "Add book from issue #${{ github.event.issue.number }}"

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcomes = {
              ingestion: '${{ steps.ingestion.outcome }}',
              commit:    '${{ steps.commit.outcome }}',
              pr:        '${{ steps.pr.outcome }}',
              merge:     '${{ steps.merge.outcome }}',
            };
            const success = outcomes.merge === 'success';

            const icon = o => o === 'success' ? '✅' : o === 'skipped' ? '⏭️' : '❌';
            const rows = [
              ['Book ingestion', outcomes.ingestion],
              ['Commit & push',  outcomes.commit],
              ['Create PR',      outcomes.pr],
              ['Merge PR',       outcomes.merge],
            ].map(([s, o]) => `| ${s} | ${icon(o)} ${o} |`).join('\n');

            const table = `| Step | Outcome |\n|---|---|\n${rows}`;
            const heading = `## ${success ? '✅ Success' : '❌ Failure'}: Add book (issue #${{ github.event.issue.number }})`;

            await core.summary.addRaw(`${heading}\n\n${table}`).write();

            const comment = success
              ? `✅ Book successfully added. The PR has been merged and the changes are live.`
              : `❌ Failed to add book.\n\n${table}\n\nSee the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: comment,
            });

            if (success) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: ${{ github.event.issue.number }},
                state: 'closed',
              });
            }
